}

function backSubjects(){showSubjects(grade)}
function backCourse(){openCourse(currentSubject,currentCategory)}

// =========================================
// 八、首頁年級選擇
// =========================================

function renderGrades(){
 const box=document.getElementById("gradeList");
 box.innerHTML="";

 for(let y=1;y<=5;y++){
  let count=courses.filter(x=>x.y===y).length+
   practicums.filter(x=>x.y===y).length;

  box.innerHTML+=`
   <div class="card grade-card" onclick="showSubjects(${y})">
    <div class="grade-number">0${y}</div>
    <h3>${["一年級","二年級","三年級","四年級","五年級"][y-1]}</h3>
    <p class="muted">${count} 個必修科目項目</p>
    <span class="tag">進入課程 →</span>
   </div>
  `;
 }
}

// =========================================
// 九、科目列表與上下學期
// =========================================

function showSubjects(y){
 grade=y;
 semester=1;
 document.getElementById("gradeTitle").textContent=
  `📚 ${y} 年級｜114級課程`;

 document.getElementById("search").value="";
 setTabStyle();
 renderSubjects(); page("subjectPage");
}

function setSemester(s){
 semester=s;
 setTabStyle();
 renderSubjects();
}

function setTabStyle(){
 document.getElementById("firstTab").classList.toggle("active",semester===1);
 document.getElementById("secondTab").classList.toggle("active",semester===2);
 document.getElementById("electiveTab").classList.toggle("active",semester===3);
}

function renderSubjects(){
 const box=document.getElementById("subjectList");
 const keyword=document.getElementById("search").value.trim();
 box.innerHTML="";

 let list=[];

 if(semester===3){
  list=electives.filter(x=>x.y===grade);
 }else{
  list=courses.filter(x=>x.y===grade&&x.s===semester)
   .concat(practicums.filter(x=>x.y===grade&&x.s===semester));
 }

 list=list.filter(x=>x.n.includes(keyword));

 if(!list.length){
  box.innerHTML="<p class='muted'>這個學期沒有符合的科目。</p>";
  return;
 }

 const categories=[...new Set(list.map(x=>x.t||"專業選修"))];

 categories.forEach(category=>{
  box.innerHTML+=`<h2>${category}</h2><div class="grid" id="group-${category}"></div>`;

  const group=document.getElementById("group-"+category);

  list.filter(x=>(x.t||"專業選修")===category).forEach(item=>{
   group.innerHTML+=`
    <div class="card subject-card"
     onclick="openCourse('${item.n}','${item.t||"專業選修"}',${item.c})">
     <span class="tag">${item.t||"專業選修"}</span>
     <h3>${item.n}</h3>
     <p>${item.c} 學分 ${item.group?"｜"+item.group:""}</p>
     <p class="muted">查看課程大綱 →</p>
    </div>
   `;
  });
 });
}

// =========================================
// 十、課程內容
// =========================================

function openCourse(name,category,credit){
 currentSubject=name;
 currentCategory=category;

 document.getElementById("courseTitle").textContent=name;
 document.getElementById("courseCategory").textContent=category;
 document.getElementById("courseMeta").textContent=
  `${grade} 年級｜${semester===3?"選修課程":semester===1?"上學期":"下學期"}｜${credit} 學分`;

 let intro=`本課程為慈濟大學五專護理科114級課程。透過理論學習與專業知識整理，建立相關學科基礎。`;

 if(name.includes("實習")||name.includes("實驗")||name.includes("實作")){
  intro="透過實際操作、技能練習及情境應用，培養專業能力與安全照護觀念。";
 }

 document.getElementById("courseIntro").textContent=intro;

 let outline=outlineData[name]||outlineData["預設"];

 document.getElementById("outline").innerHTML=outline.map((item,i)=>`
  <div class="lesson">
   <h3>第 ${i+1} 單元｜${item[0]}</h3>
   <p>${item[1]}</p>
  </div>
 `).join("");

 document.getElementById("goals").innerHTML=`
  <ul>
   <li>了解 ${name} 的基本概念及重要知識。</li>
   <li>能整理課程中的重要內容。</li>
   <li>能將所學知識連結護理專業。</li>
   <li>培養自主學習及持續複習的能力。</li>
  </ul>
 `;

 page("coursePage");
}

// =========================================
// 十一、測驗
// =========================================

function startQuiz(){
 currentQuestions=questionBank[currentSubject]||[];
 answers={};

 document.getElementById("quizResult").innerHTML="";
 document.getElementById("submitButton").disabled=false;

 document.getElementById("quizInfo").textContent=
  currentSubject+"｜"+currentQuestions.length+" 題";

 if(!currentQuestions.length){
  document.getElementById("quizContent").innerHTML=`
   <div class="card">
    <h3>此科目題庫尚未建立</h3>
    <p class="muted">目前已有課程大綱，正式題庫可以繼續新增。</p>
   </div>
  `;
  document.getElementById("submitButton").disabled=true;
 }else{
  renderQuiz();
 }

 page("quizPage");
}

function renderQuiz(){
 document.getElementById("quizContent").innerHTML=
 currentQuestions.map((q,i)=>`
  <div class="card" style="margin:14px 0">
   <h3>第 ${i+1} 題：${q.q}</h3>
   ${q.o.map((op,j)=>`
    <button class="option ${answers[i]===j?"selected":""}"
     onclick="selectAnswer(${i},${j})">
     ${String.fromCharCode(65+j)}. ${op}
    </button>
   `).join("")}
  </div>
 `).join("");
}

function selectAnswer(i,j){
 answers[i]=j;
 renderQuiz();
}

function submitQuiz(){
 let score=0;
 let detail="";

 currentQuestions.forEach((q,i)=>{
  const correct=answers[i]===q.a;
  if(correct)score++;

  if(!correct){
   if(!mistakes.some(m=>m.subject===currentSubject&&m.question===q.q)){
    mistakes.push({
     subject:currentSubject,
     question:q.q,
     options:q.o,
     answer:q.a,
     explain:q.e
    });
   }
  }

  detail+=`
   <div class="card" style="margin:12px 0">
    <h3>${correct?"✅ 答對":"❌ 答錯"}｜第 ${i+1} 題</h3>
    <p>正確答案：${q.o[q.a]}</p>
    <p>解析：${q.e}</p>
   </div>
  `;
 });

 const total=currentQuestions.length;
 const percent=Math.round(score/total*100);

 records.push({
  grade,subject:currentSubject,score:percent,
  date:new Date().toLocaleString()
 });

 save();

 document.getElementById("quizResult").innerHTML=`
  <div class="result">
   <h2>測驗完成</h2>
   <div class="stat">${percent} 分</div>
   <p>答對 ${score} 題，共 ${total} 題。</p>
  </div>
  <h2>答案與解析</h2>
  ${detail}
 `;

 document.getElementById("submitButton").disabled=true;
}

// =========================================
// 十二、學習紀錄
// =========================================

function showRecords(){
 page("recordPage");

 const count=records.length;
 const avg=count?
  Math.round(records.reduce((s,r)=>s+r.score,0)/count):0;

 document.getElementById("recordCount").textContent=count;
 document.getElementById("recordAverage").textContent=avg;
 document.getElementById("recordMistakes").textContent=mistakes.length;

 document.getElementById("recordList").innerHTML=
 count?records.slice().reverse().map(r=>`
  <div class="card" style="margin:12px 0">
   <strong>${r.grade}年級｜${r.subject}</strong>
   <p>成績：${r.score} 分</p>
   <p class="small">${r.date}</p>
  </div>
 `).join(""):"<p class='muted'>目前還沒有測驗紀錄。</p>";
}

// =========================================
// 十三、錯題本
// =========================================

function showMistakes(){
 page("mistakePage");

 document.getElementById("mistakeList").innerHTML=
 mistakes.length?mistakes.map((m,i)=>`
  <div class="card" style="margin:13px 0">
   <span class="tag">${m.subject}</span>
   <h3>${m.question}</h3>
   <p>正確答案：${m.options[m.answer]}</p>
   <p>解析：${m.explain}</p>
   <button class="secondary" onclick="deleteMistake(${i})">移除錯題</button>
  </div>
 `).join(""):"<p class='muted'>目前沒有錯題。</p>";
}

function deleteMistake(i){
 mistakes.splice(i,1);
 save();
 showMistakes();
}

// =========================================
// 十四、啟動
// =========================================

renderGrades();

</script>
</body>
</html>
